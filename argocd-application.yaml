apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: webapp

  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/nikolavrtikola/argo-helm-demo.git
    targetRevision: gitops
    path: helm/webapp

    helm:
      releaseName: webapp1

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true