name: Build and Update Helm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/nikolavrtikola/argo-demo:${{ github.sha }}

      - name: Update GitOps branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin

          # Start from the latest main
          git checkout main
          git pull origin main

          # Create/update gitops from main
          git checkout -B gitops

          # Update the Docker image tag
          sed -i "s/tag: \".*\"/tag: \"${{ github.sha }}\"/" helm/webapp/values.yaml

          # Commit the GitOps state
          git add .
          git commit -m "Update GitOps to ${{ github.sha }}" || exit 0

          # Push gitops
          git push origin gitops --force